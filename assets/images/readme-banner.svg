<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Aiman Karami — Applied Mathematics and Backend Systems">
  <defs>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#38bdf8"/>
      <animate attributeName="x1" values="-1;0;-1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="75%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#8b5cf6" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="280" rx="24" fill="#050505"/>
  <rect width="1000" height="280" rx="24" fill="url(#grid)"/>
  <rect width="1000" height="280" rx="24" fill="url(#glow)"/>

  <!-- floating math glyphs -->
  <g fill="#c084fc" font-family="monospace" opacity="0.25">
    <text x="120" y="70" font-size="26">&#8747;</text>
    <text x="850" y="90" font-size="30">&#8721;
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="800" y="220" font-size="24">&#8706;u/&#8706;t</text>
    <text x="90" y="215" font-size="22">e^{i&#960;}+1=0
      <animate attributeName="opacity" values="0.15;0.35;0.15" dur="5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- name -->
  <text x="500" y="140" text-anchor="middle" font-family="'Space Grotesk',Verdana,sans-serif" font-size="72" font-weight="700" letter-spacing="-2" fill="url(#txt)">Aiman Karami</text>

  <!-- subtitle + blinking cursor -->
  <g text-anchor="middle" font-family="monospace">
    <text x="486" y="188" font-size="20" fill="#94a3b8" letter-spacing="2">Applied Mathematics  ×  Backend Systems</text>
    <rect x="700" y="172" width="10" height="20" fill="#c084fc">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- status line -->
  <g text-anchor="middle" font-family="monospace" font-size="12" fill="#64748b" letter-spacing="3">
    <text x="500" y="232">BUILDING SYSTEMS THAT ENDURE</text>
  </g>

  <!-- animated underline -->
  <rect x="360" y="248" height="2" fill="#8b5cf6" rx="1">
    <animate attributeName="width" values="0;280;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x" values="500;360;500" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
